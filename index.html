<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Irene 的自我介紹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Noto+Sans+TC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@1,300&family=Josefin+Sans:wght@200;300&display=swap" rel="stylesheet">
  <style>
    :root {
      --night-0: #03061a;
      --night-1: #0a1238;
      --night-2: #142060;
      --star: #f4f6ff;
      --star-dim: rgba(244, 246, 255, 0.62);
      --glow: #9fb4ff;
      --line: rgba(190, 205, 255, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { overflow-x: hidden; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: "Noto Sans TC", system-ui, sans-serif;
      color: var(--star);
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(80, 100, 220, 0.28), transparent 60%),
        radial-gradient(ellipse 70% 50% at 85% 90%, rgba(120, 80, 200, 0.22), transparent 60%),
        radial-gradient(ellipse at 50% 120%, var(--night-2) 0%, var(--night-1) 45%, var(--night-0) 100%);
      background-color: var(--night-0);
      position: relative;
    }

    /* ===== 星空層 ===== */
    .sky {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .stars {
      position: absolute;
      inset: -50%;
      background-repeat: repeat;
    }

    .stars.s1 {
      background-image:
        radial-gradient(1px 1px at 20px 30px, #fff, transparent),
        radial-gradient(1px 1px at 90px 120px, #fff, transparent),
        radial-gradient(1px 1px at 160px 60px, rgba(255,255,255,.8), transparent),
        radial-gradient(1px 1px at 230px 190px, #fff, transparent),
        radial-gradient(1px 1px at 50px 220px, rgba(255,255,255,.7), transparent),
        radial-gradient(1px 1px at 280px 20px, #fff, transparent);
      background-size: 300px 260px;
      opacity: .7;
      animation: twinkle 5s ease-in-out infinite alternate, float 240s linear infinite;
    }

    .stars.s2 {
      background-image:
        radial-gradient(1.5px 1.5px at 60px 80px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 210px 40px, #dfe6ff, transparent),
        radial-gradient(1.5px 1.5px at 340px 260px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 130px 330px, #cfd9ff, transparent);
      background-size: 420px 400px;
      animation: twinkle 7s ease-in-out infinite alternate-reverse, float 180s linear infinite;
    }

    .stars.s3 {
      background-image:
        radial-gradient(2px 2px at 120px 150px, #fff, transparent),
        radial-gradient(2.5px 2.5px at 470px 380px, #e8edff, transparent),
        radial-gradient(2px 2px at 330px 90px, #fff, transparent);
      background-size: 600px 520px;
      filter: drop-shadow(0 0 3px rgba(200, 215, 255, .9));
      animation: twinkle 4s ease-in-out infinite alternate, float 120s linear infinite;
    }

    @keyframes twinkle {
      from { opacity: .35; }
      to   { opacity: 1; }
    }

    @keyframes float {
      from { transform: translate3d(0, 0, 0); }
      to   { transform: translate3d(-300px, -260px, 0); }
    }

    .shooting {
      position: absolute;
      top: 12%;
      left: 70%;
      width: 140px;
      height: 1.5px;
      background: linear-gradient(90deg, rgba(255,255,255,.95), transparent);
      border-radius: 999px;
      transform: rotate(-35deg);
      opacity: 0;
      animation: shoot 9s ease-in 2s infinite;
    }

    .shooting.late {
      top: 30%;
      left: 30%;
      animation-delay: 6.5s;
      animation-duration: 13s;
    }

    @keyframes shoot {
      0%   { opacity: 0; transform: rotate(-35deg) translateX(0); }
      2%   { opacity: 1; }
      9%   { opacity: 0; transform: rotate(-35deg) translateX(-420px); }
      100% { opacity: 0; transform: rotate(-35deg) translateX(-420px); }
    }

    /* ===== 卡片 ===== */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      padding: 52px 40px 48px;
      text-align: center;
      background: linear-gradient(160deg, rgba(30, 42, 110, 0.55), rgba(8, 12, 40, 0.7));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow:
        0 30px 80px rgba(0, 0, 10, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 0 60px rgba(110, 140, 255, 0.08);
      animation: rise 1s ease-out both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      position: relative;
      width: 112px;
      height: 112px;
      margin: 0 auto 28px;
    }

    /* 細線彎月 */
    .avatar svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 0 6px rgba(200, 215, 255, 0.55)) drop-shadow(0 0 22px rgba(160, 185, 255, 0.25));
    }

    .avatar .tw { animation: twinkle 3s ease-in-out infinite alternate; }
    .avatar .tw.d1 { animation-delay: -1s; }
    .avatar .tw.d2 { animation-delay: -2s; }
    .avatar .tw.d3 { animation-delay: -0.5s; }

    .hello {
      font-family: "Josefin Sans", system-ui, sans-serif;
      font-weight: 300;
      font-size: 14px;
      letter-spacing: 0.35em;
      padding-left: 0.35em; /* 抵銷字距，保持置中 */
      text-transform: uppercase;
      color: var(--star-dim);
      margin-bottom: 8px;
    }

    h1 {
      font-family: "Josefin Sans", system-ui, sans-serif;
      font-size: 60px;
      font-weight: 200;
      line-height: 1.1;
      letter-spacing: 0.12em;
      padding-left: 0.12em; /* 抵銷字距造成的視覺偏移，保持置中 */
      background: linear-gradient(180deg, #ffffff 30%, #b9c7ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 18px rgba(160, 185, 255, 0.45));
      margin-bottom: 32px;
    }

    .section-title {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3em;
      color: var(--star-dim);
      margin-bottom: 16px;
    }

    .section-title::before,
    .section-title::after {
      content: "✦";
      font-size: 9px;
      color: var(--glow);
      letter-spacing: 0;
    }

    .interests {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .tag {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line);
      color: var(--star);
      font-size: 16px;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    }

    .tag:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(200, 215, 255, 0.5);
      box-shadow: 0 0 24px rgba(140, 165, 255, 0.35);
    }

    .tag span { font-size: 20px; }

    blockquote {
      position: relative;
      padding-top: 30px;
      border-top: 1px solid var(--line);
      font-family: "Cormorant Garamond", "Playfair Display", serif;
      font-style: italic;
      font-weight: 300;
      font-size: 26px;
      letter-spacing: 0.03em;
      line-height: 1.5;
      color: rgba(234, 239, 255, 0.9);
    }

    blockquote::before {
      content: "✦";
      position: absolute;
      top: -11px;
      left: 50%;
      transform: translateX(-50%);
      padding: 0 14px;
      font-family: system-ui, sans-serif;
      font-style: normal;
      font-size: 16px;
      line-height: 20px;
      color: #fff;
      text-shadow: 0 0 10px rgba(200, 215, 255, 0.9);
      background: #0c1236;
      border-radius: 999px;
    }

    @media (max-width: 480px) {
      .card { padding: 40px 24px 36px; }
      h1 { font-size: 50px; }
      blockquote { font-size: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="stars s1"></div>
    <div class="stars s2"></div>
    <div class="stars s3"></div>
    <div class="shooting"></div>
    <div class="shooting late"></div>
  </div>

  <main class="card">
    <div class="avatar" aria-hidden="true">
      <svg viewBox="0 0 120 120">
        <defs>
          <mask id="moon-cut">
            <rect x="0" y="0" width="120" height="120" fill="#fff"/>
            <circle cx="74" cy="50" r="34" fill="#000"/>
          </mask>
          <clipPath id="moon-clip"><circle cx="56" cy="62" r="38"/></clipPath>
          <linearGradient id="moon-fill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
            <stop offset="1" stop-color="#b9c7ff" stop-opacity=".04"/>
          </linearGradient>
        </defs>
        <!-- 彎月：外圓扣掉內圓 -->
        <circle cx="56" cy="62" r="38" fill="url(#moon-fill)" mask="url(#moon-cut)"/>
        <circle cx="56" cy="62" r="38" fill="none" stroke="#eef2ff" stroke-width="1.1" mask="url(#moon-cut)"/>
        <circle cx="74" cy="50" r="34" fill="none" stroke="#eef2ff" stroke-width="1.1" clip-path="url(#moon-clip)"/>
        <!-- 星芒與小星 -->
        <path class="tw" d="M96 22 L97.4 27.6 L103 29 L97.4 30.4 L96 36 L94.6 30.4 L89 29 L94.6 27.6 Z" fill="#fff"/>
        <path class="tw d1" d="M84 60 L84.8 63.2 L88 64 L84.8 64.8 L84 68 L83.2 64.8 L80 64 L83.2 63.2 Z" fill="#fff"/>
        <circle class="tw d2" cx="106" cy="50" r="1.2" fill="#fff"/>
        <circle class="tw d3" cx="78" cy="14" r="1" fill="#fff"/>
      </svg>
    </div>
    <p class="hello">Hello, I'm</p>
    <h1>Irene</h1>

    <p class="section-title">我的興趣</p>
    <div class="interests">
      <div class="tag"><span>📷</span>攝影</div>
      <div class="tag"><span>✈️</span>旅行</div>
    </div>

    <blockquote>Curious mind, endless possibilities.</blockquote>
  </main>
</body>
</html>
